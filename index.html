<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Windows 11 Simulator (2016 Retro Edition)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            background-image: linear-gradient(135deg, #005c8a, #002b3d);
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        /* Desktop Icons */
        .desktop-icon {
            width: 70px;
            height: 80px;
            position: absolute;
            top: 30px;
            left: 30px;
            text-align: center;
            color: white;
            cursor: pointer;
            font-size: 12px;
            text-shadow: 1px 1px 2px black;
        }
        .desktop-icon div.icon-img {
            width: 40px;
            height: 40px;
            background: #0078d7;
            margin: 0 auto 5px auto;
            border-radius: 8px;
            line-height: 40px;
            font-size: 20px;
        }

        /* Taskbar */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(32, 32, 32, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .taskbar-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin: 0 4px;
            outline: none;
        }
        .taskbar-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Start Menu */
        #start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 380px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            color: white;
        }
        #start-menu h3 {
            margin-top: 0;
            font-size: 14px;
            color: #aaa;
        }
        .start-app-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
        }
        .start-app-item:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Window (Notepad) */
        #window {
            position: absolute;
            top: 60px;
            left: 60px;
            width: 400px;
            height: 280px;
            background: #f3f3f3;
            border: 1px solid #ccc;
            border-radius: 6px;
            display: none;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .window-header {
            height: 30px;
            background: #e1e1e1;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            color: #333;
            cursor: move;
        }
        .window-close {
            background: #e81123;
            color: white;
            border: none;
            width: 24px;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
        }
        .window-body {
            flex: 1;
            padding: 10px;
        }
        .window-body textarea {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid #ddd;
            resize: none;
            font-family: Arial;
        }
    </style>
</head>
<body>

    <!-- Desktop Icon -->
    <div class="desktop-icon" onclick="toggleWindow()">
        <div class="icon-img">📝</div>
        Notizblock
    </div>

    <!-- Window -->
    <div id="window">
        <div class="window-header">
            <span>Editor - Notizblock</span>
            <button class="window-close" onclick="toggleWindow()">X</button>
        </div>
        <div class="window-body">
            <textarea placeholder="Schreibe hier etwas auf deinem Dyon TV..."></textarea>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <h3>Angeheftet</h3>
        <div class="start-app-item" onclick="toggleWindow(); toggleStart();">
            📝 Notizblock öffnen
        </div>
        <div class="start-app-item" onclick="alert('Windows 11 auf dem Dyon TV läuft stabil!');">
            ℹ️ System-Info
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <button class="taskbar-btn" onclick="toggleStart()" title="Start">⊞</button>
        <button class="taskbar-btn" onclick="toggleWindow()" title="Notizblock">📝</button>
    </div>

    <script>
        // 2016-kompatibles ES5 JavaScript
        function toggleStart() {
            var menu = document.getElementById("start-menu");
            if (menu.style.display === "flex") {
                menu.style.display = "none";
            } else {
                menu.style.display = "flex";
            }
        }

        function toggleWindow() {
            var win = document.getElementById("window");
            if (win.style.display === "flex") {
                win.style.display = "none";
            } else {
                win.style.display = "flex";
            }
        }
    </script>
</body>
</html>
