<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite YT Player (2016 Hardware)</title>
    <style>
        /* Verhindert Layout-Shifts und nutzt Hardware-Beschleunigung */
        body { background: #000; margin: 0; font-family: sans-serif; overflow: hidden; }
        .player-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        
        /* Das eigentliche Video-Fenster */
        #video-placeholder { width: 100%; height: 100%; transform: translateZ(0); }

        /* Minimalistische Overlays (nur sichtbar, wenn gebraucht) */
        .controls-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 20px; display: flex; align-items: center; gap: 15px;
            opacity: 1; transition: opacity 0.3s ease; z-index: 10;
        }
        .controls-overlay.hidden { opacity: 0; pointer-events: none; }

        /* Große, leicht zu treffende Buttons ohne CSS-Schnickschnack */
        button {
            background: #e60000; color: white; border: none; padding: 12px 24px;
            font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer;
        }
        button:active { background: #b30000; }

        /* Performance-schonender Fortschrittsbalken */
        .progress-bar {
            flex-grow: 1; height: 8px; background: rgba(255,255,255,0.3);
            position: relative; border-radius: 4px; cursor: pointer;
        }
        .progress-fill { height: 100%; width: 0%; background: #e60000; border-radius: 4px; }
    </style>
</head>
<body>

<div class="player-container">
    <!-- Der Platzhalter wird von der API durch das IFrame ersetzt -->
    <div id="video-placeholder"></div>

    <!-- Steuerungsoverlay -->
    <div class="controls-overlay" id="controls">
        <button id="play-btn" onclick="togglePlayback()">Pause</button>
        <div class="progress-bar" onclick="seek(event)">
            <div class="progress-fill" id="progress"></div>
        </div>
    </div>
</div>

<script>
    // 1. Laden der YouTube IFrame API (Asynchron, blockiert das Rendering nicht)
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var controls = document.getElementById('controls');
    var playBtn = document.getElementById('play-btn');
    var progressFill = document.getElementById('progress');
    var hideTimeout;

    // 2. Wird automatisch aufgerufen, sobald die API bereit ist
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('video-placeholder', {
            videoId: 'M7lc1UVf-VE', // Ersetze dies mit deiner Video-ID
            playerVars: {
                'autoplay': 1,
                'controls': 0,          // Deaktiviert den schweren Standard-Player
                'rel': 0,               // Keine fremden Videoempfehlungen am Ende
                'showinfo': 0,          // Veraltet, spart aber Parsing-Zeit auf Alt-Systemen
                'iv_load_policy': 3,    // Schaltet störende Einblendungen ab
                'modestbranding': 1,
                'playsinline': 1
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        // Startet ein Intervall zur Aktualisierung des Fortschrittsbalkens (schonend alle 500ms)
        setInterval(updateProgress, 500);
        setupOverlayTimer();
    }

    function onPlayerStateChange(event) {
        // Zustand 1 = Abspielen, Zustand 2 = Pausiert
        if (event.data == YT.PlayerState.PLAYING) {
            playBtn.innerHTML = "Pause";
            setupOverlayTimer();
        } else {
            playBtn.innerHTML = "Play";
            showControls(); // Zeigt die Steuerung dauerhaft, wenn pausiert
            clearTimeout(hideTimeout);
        }
    }

    // 3. Wiedergabe-Logik
    function togglePlayback() {
        if (player.getPlayerState() == YT.PlayerState.PLAYING) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
    }

    // Aktualisiert die rote Timeline ohne rechenintensive CSS-Transitions
    function updateProgress() {
        if (player && player.getDuration) {
            var currentTime = player.getCurrentTime();
            var duration = player.getDuration();
            if (duration > 0) {
                var percentage = (currentTime / duration) * 100;
                progressFill.style.width = percentage + "%";
            }
        }
    }

    // Spulen im Video per Klick auf die Timeline
    function seek(event) {
        var progressBar = event.currentTarget;
        var rect = progressBar.getBoundingClientRect();
        var clickX = event.clientX - rect.left;
        var width = rect.width;
        var percentage = clickX / width;
        var duration = player.getDuration();
        player.seekTo(duration * percentage, true);
    }

    // 4. Performance-Tricks für flüssiges Interface (Ausblenden bei Inaktivität)
    function setupOverlayTimer() {
        clearTimeout(hideTimeout);
        hideTimeout = setTimeout(function() {
            controls.classList.add('hidden');
        }, 3000); // Blendet Controls nach 3 Sekunden aus
    }

    function showControls() {
        controls.classList.remove('hidden');
    }

    // Registriert Bewegungen, um das Overlay auf Alt-Geräten wieder einzublenden
    document.addEventListener('mousemove', function() {
        showControls();
        if (player && player.getPlayerState() == YT.PlayerState.PLAYING) {
            setupOverlayTimer();
        }
    });
    
    document.addEventListener('click', function() {
        showControls();
        if (player && player.getPlayerState() == YT.PlayerState.PLAYING) {
            setupOverlayTimer();
        }
    });
</script>

</body>
</html>
