<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Windows 11 Simulator (TV Edition)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            background-image: linear-gradient(135deg, #005c8a, #002b3d);
            font-family: Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        /* Desktop Icons */
        .desktop-icons {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .desktop-icon {
            width: 70px;
            height: 80px;
            text-align: center;
            color: white;
            cursor: pointer;
            font-size: 12px;
            text-shadow: 1px 1px 2px black;
        }
        .desktop-icon div.icon-img {
            width: 40px;
            height: 40px;
            background: #0078d7;
            margin: 0 auto 5px auto;
            border-radius: 8px;
            line-height: 40px;
            font-size: 20px;
        }

        /* Taskbar */
        #taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(32, 32, 32, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .taskbar-btn {
            width: 40px;
            height: 40px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin: 0 4px;
            outline: none;
        }
        .taskbar-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #clock {
            position: absolute;
            right: 15px;
            color: white;
            font-size: 12px;
            text-align: right;
            line-height: 16px;
        }

        /* Start Menu */
        #start-menu {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 380px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            color: white;
        }
        #start-menu h3 {
            margin-top: 0;
            font-size: 14px;
            color: #aaa;
        }
        .start-app-item {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
        }
        .start-app-item:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Windows */
        .window {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 350px;
            height: 280px;
            background: #f3f3f3;
            border: 1px solid #ccc;
            border-radius: 6px;
            display: none;
            flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .window-header {
            height: 30px;
            background: #e1e1e1;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
            color: #333;
            cursor: pointer;
        }
        /* Wenn Fenster am Cursor klebt, Header gelb markieren als Signal */
        .window.dragging .window-header {
            background: #fce100;
        }
        .window-close {
            background: #e81123;
            color: white;
            border: none;
            width: 24px;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
        }
        .window-body {
            flex: 1;
            padding: 10px;
            overflow: hidden;
        }
        .window-body textarea {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 1px solid #ddd;
            resize: none;
            font-family: Arial;
        }

        /* Calculator styles */
        #calc-display {
            width: 100%;
            height: 40px;
            background: white;
            border: 1px solid #ccc;
            font-size: 20px;
            text-align: right;
            padding: 5px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .calc-keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            height: 160px;
        }
        .calc-keys button {
            background: #fff;
            border: 1px solid #ccc;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
        .calc-keys button:hover {
            background: #e5e5e5;
        }
    </style>
</head>
<body onmousemove="moveWindow(event)">

    <!-- Desktop Icons -->
    <div class="desktop-icons">
        <div class="desktop-icon" onclick="openWindow('notepad-win')">
            <div class="icon-img">📝</div>
            Notizblock
        </div>
        <div class="desktop-icon" onclick="openWindow('calc-win')">
            <div class="icon-img">🔢</div>
            Rechner
        </div>
    </div>

    <!-- Notepad Window -->
    <div id="notepad-win" class="window" onclick="bringToFront('notepad-win')">
        <div class="window-header" onclick="toggleDrag('notepad-win')">
            <span>Editor - Notizblock (Klick zum Bewegen)</span>
            <button class="window-close" onclick="closeWindow('notepad-win'); event.stopPropagation();">X</button>
        </div>
        <div class="window-body">
            <textarea placeholder="Schreibe hier..."></textarea>
        </div>
    </div>

    <!-- Calculator Window -->
    <div id="calc-win" class="window" onclick="bringToFront('calc-win')" style="left: 120px; top: 90px; width: 260px; height: 310px;">
        <div class="window-header" onclick="toggleDrag('calc-win')">
            <span>Taschenrechner (Klick zum Bewegen)</span>
            <button class="window-close" onclick="closeWindow('calc-win'); event.stopPropagation();">X</button>
        </div>
        <div class="window-body">
            <div id="calc-display">0</div>
            <div class="calc-keys">
                <button onclick="calcNum('7')">7</button>
                <button onclick="calcNum('8')">8</button>
                <button onclick="calcNum('9')">9</button>
                <button onclick="calcOp('/')">/</button>
                <button onclick="calcNum('4')">4</button>
                <button onclick="calcNum('5')">5</button>
                <button onclick="calcNum('6')">6</button>
                <button onclick="calcOp('*')">*</button>
                <button onclick="calcNum('1')">1</button>
                <button onclick="calcNum('2')">2</button>
                <button onclick="calcNum('3')">3</button>
                <button onclick="calcOp('-')">-</button>
                <button onclick="calcNum('0')">0</button>
                <button onclick="calcClear()">C</button>
                <button onclick="calcEquals()">=</button>
                <button onclick="calcOp('+')">+</button>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <h3>Angeheftet</h3>
        <div class="start-app-item" onclick="openWindow('notepad-win'); toggleStart();">
            📝 Notizblock
        </div>
        <div class="start-app-item" onclick="openWindow('calc-win'); toggleStart();">
            🔢 Taschenrechner
        </div>
        <div class="start-app-item" onclick="alert('Dyon TV Windows 11 laeuft super!');">
            ℹ️ System-Info
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <button class="taskbar-btn" onclick="toggleStart()" title="Start">⊞</button>
        <button class="taskbar-btn" onclick="openWindow('notepad-win')" title="Notizblock">📝</button>
        <button class="taskbar-btn" onclick="openWindow('calc-win')" title="Rechner">🔢</button>
        <div id="clock">00:00<br><small>Dyon TV</small></div>
    </div>

    <script>
        var highestZ = 100;
        var activeDraggedWindow = null;
        var offsetX = 0;
        var offsetY = 0;

        function toggleStart() {
            var menu = document.getElementById("start-menu");
            if (menu.style.display === "flex") {
                menu.style.display = "none";
            } else {
                menu.style.display = "flex";
            }
        }

        function openWindow(id) {
            var win = document.getElementById(id);
            win.style.display = "flex";
            bringToFront(id);
            document.getElementById("start-menu").style.display = "none";
        }

        function closeWindow(id) {
            document.getElementById(id).style.display = "none";
            if (activeDraggedWindow === id) {
                activeDraggedWindow = null;
            }
        }

        function bringToFront(id) {
            highestZ++;
            document.getElementById(id).style.zIndex = highestZ;
        }

        // Ein-Klick-Toggle zum Greifen und Loslassen für Fernbedienungen
        function toggleDrag(id) {
            var win = document.getElementById(id);
            if (activeDraggedWindow === id) {
                // Loslassen
                activeDraggedWindow = null;
                win.classList.remove("dragging");
            } else {
                // Wenn ein anderes Fenster aktiv war, das erst loslassen
                if (activeDraggedWindow) {
                    document.getElementById(activeDraggedWindow).classList.remove("dragging");
                }
                // Greifen
                activeDraggedWindow = id;
                win.classList.add("dragging");
                bringToFront(id);
            }
            event.stopPropagation();
        }

        // Fenster bewegen, wenn es im "Aktiv"-Modus ist
        function moveWindow(e) {
            if (!activeDraggedWindow) return;
            var win = document.getElementById(activeDraggedWindow);
            // Zentriert das Fenster leicht unter den Cursor beim Bewegen
            win.style.left = (e.clientX - 100) + "px";
            win.style.top = (e.clientY - 15) + "px";
        }

        // Clock Update
        function updateClock() {
            var d = new Date();
            var hours = d.getHours();
            var minutes = d.getMinutes();
            if (hours < 10) hours = "0" + hours;
            if (minutes < 10) minutes = "0" + minutes;
            document.getElementById("clock").innerHTML = hours + ":" + minutes + "<br><small>Dyon TV</small>";
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Calculator Logic
        var calcExpression = "";
        function calcNum(val) {
            calcExpression += val;
            document.getElementById("calc-display").innerText = calcExpression;
        }
        function calcOp(op) {
            calcExpression += op;
            document.getElementById("calc-display").innerText = calcExpression;
        }
        function calcClear() {
            calcExpression = "";
            document.getElementById("calc-display").innerText = "0";
        }
        function calcEquals() {
            try {
                var res = eval(calcExpression);
                document.getElementById("calc-display").innerText = res;
                calcExpression = res.toString();
            } catch (e) {
                document.getElementById("calc-display").innerText = "Fehler";
                calcExpression = "";
            }
        }
    </script>
</body>
</html>
